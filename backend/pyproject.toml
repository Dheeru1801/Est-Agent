[project]
name = "groundwork-rag-agent"
version = "0.1.0"
description = "FastAPI RAG chatbot with LangChain, LangGraph, Gemini, and Pinecone"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1,<2",
    "langchain>=0.3,<2",
    "langchain-google-genai>=4.0,<5",
    "google-genai>=2,<3",
    "langchain-community>=0.3,<1",
    "langchain-text-splitters>=0.3,<2",
    "pinecone>=10.1,<11",
    "langgraph>=0.2,<2",
    "docling>=2,<3",
    "pymupdf>=1.28,<2",
    "pymupdf4llm>=0.0.17,<2",
]

[tool.uv]
# This backend runs directly from its source directory and is not built as a wheel.
package = false
